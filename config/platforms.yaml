scan_interval_minutes: 10

platforms:
  reddit:
    enabled: true
    collector: reddit_browser
    browser_profile_dir: ~/.kvasir/browser_profiles/reddit_profile
    headless: true
    max_posts_per_target: 12
    max_targets_per_run: 8   # random sample size per pipeline run
    inter_request_delay_min: 2.0   # seconds — random sleep between targets
    inter_request_delay_max: 5.0
    max_consecutive_failures: 3    # exclude target after this many empty runs in a row
    discovery:
      enabled: true
      inter_request_delay_min: 2.0
      inter_request_delay_max: 4.0
      min_subscribers: 5000
      queries:
        - "books reading literature"
        - "ai learning education"
        - "quiz trivia games"
        - "classic literature"
        - "book recommendations"
        - "interactive learning"
        # Russian-language discovery
        - "русская литература книги"
        - "что почитать литература ИИ"
    targets:
      - type: subreddit:hot
        value: books
      - type: subreddit:hot
        value: suggestmeabook
      - type: subreddit:new
        value: ChatGPT
      - type: subreddit:new
        value: singularity
      - type: subreddit:hot
        value: artificial
      - type: subreddit:hot
        value: Teachers
      - type: subreddit:hot
        value: homeschool
      - type: subreddit:hot
        value: literature
      - type: subreddit:new
        value: SideProject
      - type: subreddit:search
        value: "quiz app"
      - type: subreddit:search
        value: "books ai"
      - type: subreddit:search
        value: "interactive reading"
      # Author / book-specific subreddits
      - type: subreddit:hot
        value: dostoevsky
      - type: subreddit:hot
        value: Sherlock
      - type: subreddit:hot
        value: booksuggestions
      # Game / quiz subreddits (→ link to quizly.pub main site)
      - type: subreddit:hot
        value: boardgames
      - type: subreddit:hot
        value: puzzles
      - type: subreddit:search
        value: "reading quiz"
      - type: subreddit:search
        value: "book discussion AI"
      # Russian-language communities & global search (Cyrillic)
      - type: subreddit:hot
        value: RussianLiterature
      - type: subreddit:new
        value: RussianLiterature
      - type: subreddit:hot
        value: ru
      - type: subreddit:hot
        value: russian
      - type: subreddit:hot
        value: learnrussian
      - type: subreddit:search
        value: "что почитать книги"
      - type: subreddit:search
        value: "русская литература обсуждение"
      - type: subreddit:search
        value: "книги ИИ чтение приложение"

      # ── CharacterAI / AI persona communities ──────────────────────────────
      # Echo contests = "AI chat with a literary character" → natural fit for
      # people exploring or leaving CharacterAI and similar platforms.
      - type: subreddit:hot
        value: CharacterAI
      - type: subreddit:new
        value: CharacterAI
      - type: subreddit:hot
        value: AICompanion
      - type: subreddit:search
        value: "character ai alternative"
      - type: subreddit:search
        value: "chat with book character"
      - type: subreddit:search
        value: "talk to ai character"

      # ── AI video / creative — scene contest angle ──────────────────────────
      # These were in _HIGH_VALUE_TARGETS in scoring.py but never added here.
      - type: subreddit:hot
        value: aivideo
      - type: subreddit:hot
        value: AIArt
      - type: subreddit:hot
        value: aigeneratedart
      - type: subreddit:new
        value: MediaSynthesis
      - type: subreddit:search
        value: "ai video contest 2026"
      - type: subreddit:search
        value: "ai creative challenge"

      # ── Interactive fiction / narrative AI ────────────────────────────────
      # People already engaging with AI-driven stories; welcome page is a
      # natural "try it free" demo with no login required.
      - type: subreddit:hot
        value: interactivefiction
      - type: subreddit:hot
        value: AIstories
      - type: subreddit:search
        value: "interactive fiction ai"

      # ── Trivia / quiz communities ─────────────────────────────────────────
      # r/trivia is listed in game_subreddits (book_catalog.yaml) but was
      # never added here — gap closed.
      - type: subreddit:hot
        value: trivia
      - type: subreddit:hot
        value: triviatime

      # ── Reading-challenge / contest-minded readers ─────────────────────────
      - type: subreddit:hot
        value: 52book
      - type: subreddit:hot
        value: bookchallenge

      # ── Character / world creators ────────────────────────────────────────
      # Writers building characters → "make an AI echo of your character"
      - type: subreddit:new
        value: worldbuilding
      - type: subreddit:new
        value: PromptEngineering
      - type: subreddit:search
        value: "ai character persona"

  twitter:
    enabled: false
    collector: twitter
    max_items_per_target: 10
    delay_seconds: 2.0             # sleep between query requests
    targets:
      - type: search
        value: "AI books quiz"
      - type: search
        value: "education startup"
      - type: search
        value: "book recommendations app"
      - type: search
        value: "interactive learning AI"

  youtube:
    enabled: true
    collector: youtube
    max_posts_per_target: 10     # videos per search query
    max_targets_per_run: 10      # wider pool — sample more queries per pipeline run
    inter_request_sleep_min: 1.5 # seconds — random sleep between API calls
    inter_request_sleep_max: 3.5
    fetch_top_comment: true      # fetch top comment for each video (costs 1 quota unit each)
    targets:
      # Core book / reading intent
      - type: video_search
        value: "book discussion AI recommendations"
      - type: video_search
        value: "classic literature analysis video essay"
      - type: video_search
        value: "book club discussion questions"
      - type: video_search
        value: "what should I read next recommendations"
      - type: video_search
        value: "BookTok reading community react"
      - type: video_search
        value: "reading slump how to read more books"
      - type: video_search
        value: "book vs movie adaptation debate"
      - type: video_search
        value: "buddy read vlog book reaction"
      - type: video_search
        value: "52 books reading challenge"
      - type: video_search
        value: "spoiler free book review deep dive"
      # Video essay / lit-culture niches
      - type: video_search
        value: "why you should read this book essay"
      - type: video_search
        value: "dark academia reading aesthetic books"
      - type: video_search
        value: "study with me literature exam"
      - type: video_search
        value: "AP English literature themes explained"
      - type: video_search
        value: "Shakespeare explained for students"
      - type: video_search
        value: "poetry analysis explained simple"
      - type: video_search
        value: "learn language by reading novels tips"
      # AI / tools / interactive learning (Quizly-adjacent)
      - type: video_search
        value: "AI reading app review 2025"
      - type: video_search
        value: "ChatGPT for studying books homework"
      - type: video_search
        value: "interactive fiction AI chat story"
      - type: video_search
        value: "AI tutor explain book chapter"
      - type: video_search
        value: "interactive learning games for adults"
      - type: video_search
        value: "EdTech tools for English teachers"
      - type: video_search
        value: "language learning app gamification"
      # Quiz / games / brainy fun
      - type: video_search
        value: "literary quiz pub trivia books"
      - type: video_search
        value: "guess the book from emoji challenge"
      - type: video_search
        value: "book trivia gameshow style"
      - type: video_search
        value: "word game puzzle lovers book recommendations"
      - type: video_search
        value: "only connect literary connections"
      - type: video_search
        value: "escape room puzzle solving riddles"
      # Creators / formats that spark comments
      - type: video_search
        value: "booktube shelf tour underrated picks"
      - type: video_search
        value: "author interview writing advice readers"
      - type: video_search
        value: "nonfiction book summary critical thinking"
      - type: video_search
        value: "audiobook vs reading which is better science"
      - type: video_search
        value: "Kindle Scribe note taking reading workflow"
      # CharacterAI alternative / AI persona seekers
      - type: video_search
        value: "character AI alternatives 2026"
      - type: video_search
        value: "talk to AI book characters apps"
      - type: video_search
        value: "AI roleplay literary characters"
      # AI video / scene contest creators
      - type: video_search
        value: "AI video generation contest submission"
      - type: video_search
        value: "text to video AI creative challenge"
      - type: video_search
        value: "best AI video tools 2026 contest"
      # Interactive fiction / welcome-page top-of-funnel
      - type: video_search
        value: "AI interactive story no login free try"
      - type: video_search
        value: "AI fiction chat demo comparison"

      # Russian-language (relevance_language + region bias results toward RU creators)
      - type: video_search
        value: "что почитать книги рекомендации"
        relevance_language: ru
        region_code: RU
      - type: video_search
        value: "русская литература классика обсуждение"
        relevance_language: ru
        region_code: RU
      - type: video_search
        value: "книжный клуб литература видеоблог"
        relevance_language: ru
        region_code: RU
      - type: video_search
        value: "ИИ чтение книги приложение искусственный интеллект"
        relevance_language: ru
        region_code: RU
      - type: video_search
        value: "литературная викторина квиз по книгам"
        relevance_language: ru
        region_code: RU
      - type: video_search
        value: "интерактивное обучение ИИ школа книги"
        relevance_language: ru
        region_code: RU
