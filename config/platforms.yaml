scan_interval_minutes: 10

platforms:
  reddit:
    enabled: true
    collector: reddit_browser
    browser_profile_dir: ~/.kvasir/browser_profiles/reddit_profile
    headless: true
    max_posts_per_target: 20   # wider: more posts scanned per subreddit
    max_targets_per_run: 14    # wider: sample more targets per pipeline run
    inter_request_delay_min: 2.0   # seconds — random sleep between targets
    inter_request_delay_max: 5.0
    max_consecutive_failures: 4    # wider: give targets more chances before exclusion
    discovery:
      enabled: true
      inter_request_delay_min: 2.0
      inter_request_delay_max: 4.0
      min_subscribers: 2000      # wider: include smaller niche communities
      queries:
        - "ai learning education"
        - "quiz trivia games"
        - "book recommendations"
        - "interactive learning"
        # Entertainment / fun / animals (new emphasis)
        - "animals cute funny"
        - "talk to ai character fun"
        - "memes pop culture"
        - "writing prompts short stories"
        # Wider net — general-interest & adjacent communities
        - "movies tv shows fandom"
        - "history mythology stories"
        - "trivia quiz night"
        - "hobbies casual fun"
        - "ai art creative tools"
        - "language learning practice"
        # Russian-language discovery (expanded)
        - "русская литература книги"
        - "что почитать литература ИИ"
        - "мемы приколы юмор"
        - "русский чат бот персонажи ИИ"
        - "фильмы сериалы фэндом"
        - "история мифология факты"
    targets:
      - type: subreddit:hot
        value: books
      - type: subreddit:hot
        value: suggestmeabook
      - type: subreddit:new
        value: ChatGPT
      - type: subreddit:new
        value: singularity
      - type: subreddit:hot
        value: artificial
      - type: subreddit:hot
        value: Teachers
      - type: subreddit:hot
        value: homeschool
      - type: subreddit:hot
        value: literature
      - type: subreddit:new
        value: SideProject
      - type: subreddit:search
        value: "quiz app"
      - type: subreddit:search
        value: "books ai"
      - type: subreddit:search
        value: "interactive reading"
      # Author / book-specific subreddits
      - type: subreddit:hot
        value: dostoevsky
      - type: subreddit:hot
        value: Sherlock
      - type: subreddit:hot
        value: booksuggestions
      # Game / quiz subreddits (→ link to quizly.pub main site)
      - type: subreddit:hot
        value: boardgames
      - type: subreddit:hot
        value: puzzles
      - type: subreddit:search
        value: "reading quiz"
      - type: subreddit:search
        value: "book discussion AI"
      # ── Entertainment / fun / animals (new emphasis) ──────────────────────
      # Lead with playful AI chat / Animal Stories — not books.
      - type: subreddit:hot
        value: aww
      - type: subreddit:hot
        value: Awwducational
      - type: subreddit:hot
        value: NatureIsFuckingLit
      - type: subreddit:hot
        value: likeus
      - type: subreddit:hot
        value: WritingPrompts
      - type: subreddit:new
        value: WritingPrompts
      - type: subreddit:hot
        value: tipofmytongue
      - type: subreddit:hot
        value: CasualConversation
      - type: subreddit:search
        value: "talk to ai character fun"
      - type: subreddit:search
        value: "funny animal story"

      # Russian-language communities & global search (Cyrillic) — expanded
      - type: subreddit:hot
        value: RussianLiterature
      - type: subreddit:new
        value: RussianLiterature
      - type: subreddit:hot
        value: ru
      - type: subreddit:hot
        value: russian
      - type: subreddit:hot
        value: AskARussian
      - type: subreddit:hot
        value: Pikabu
      - type: subreddit:hot
        value: learnrussian
      - type: subreddit:search
        value: "что почитать книги"
      - type: subreddit:search
        value: "русская литература обсуждение"
      - type: subreddit:search
        value: "книги ИИ чтение приложение"
      - type: subreddit:search
        value: "чат с персонажем ИИ нейросеть"
      - type: subreddit:search
        value: "мемы приколы конкурс"

      # ── CharacterAI / AI persona communities ──────────────────────────────
      # Echo contests = "AI chat with a literary character" → natural fit for
      # people exploring or leaving CharacterAI and similar platforms.
      - type: subreddit:hot
        value: CharacterAI
      - type: subreddit:new
        value: CharacterAI
      - type: subreddit:hot
        value: AICompanion
      - type: subreddit:search
        value: "character ai alternative"
      - type: subreddit:search
        value: "chat with book character"
      - type: subreddit:search
        value: "talk to ai character"

      # ── AI video / creative — scene contest angle ──────────────────────────
      # These were in _HIGH_VALUE_TARGETS in scoring.py but never added here.
      - type: subreddit:hot
        value: aivideo
      - type: subreddit:hot
        value: AIArt
      - type: subreddit:hot
        value: aigeneratedart
      - type: subreddit:new
        value: MediaSynthesis
      - type: subreddit:search
        value: "ai video contest 2026"
      - type: subreddit:search
        value: "ai creative challenge"

      # ── Interactive fiction / narrative AI ────────────────────────────────
      # People already engaging with AI-driven stories; welcome page is a
      # natural "try it free" demo with no login required.
      - type: subreddit:hot
        value: interactivefiction
      - type: subreddit:hot
        value: AIstories
      - type: subreddit:search
        value: "interactive fiction ai"

      # ── Trivia / quiz communities ─────────────────────────────────────────
      # r/trivia is listed in game_subreddits (book_catalog.yaml) but was
      # never added here — gap closed.
      - type: subreddit:hot
        value: trivia
      - type: subreddit:hot
        value: triviatime

      # ── Reading-challenge / contest-minded readers ─────────────────────────
      - type: subreddit:hot
        value: 52book
      - type: subreddit:hot
        value: bookchallenge

      # ── Character / world creators ────────────────────────────────────────
      # Writers building characters → "make an AI echo of your character"
      - type: subreddit:new
        value: worldbuilding
      - type: subreddit:new
        value: PromptEngineering
      - type: subreddit:search
        value: "ai character persona"

  twitter:
    enabled: false
    collector: twitter
    max_items_per_target: 10
    delay_seconds: 2.0             # sleep between query requests
    targets:
      - type: search
        value: "AI books quiz"
      - type: search
        value: "education startup"
      - type: search
        value: "book recommendations app"
      - type: search
        value: "interactive learning AI"

  youtube:
    enabled: true
    collector: youtube
    max_posts_per_target: 15     # wider: more videos per search query
    max_targets_per_run: 16      # wider: sample more queries per pipeline run
    inter_request_sleep_min: 1.5 # seconds — random sleep between API calls
    inter_request_sleep_max: 3.5
    fetch_top_comment: true      # fetch recent comments for each video (costs 1 quota unit each)
    # ── Freshness filters ──
    # Keep a video if it is recent OR still has a live conversation.
    # An old video is allowed back in when its newest comment is fresh.
    max_age_days: 365            # videos newer than this qualify on recency alone (0 = age never matters)
    fresh_comment_days: 30       # an OLDER video is rescued if its newest comment is this fresh
                                 # (needs fetch_top_comment; set 0 to disable the rescue)
    targets:
      # Core book / reading intent
      - type: video_search
        value: "book discussion AI recommendations"
      - type: video_search
        value: "classic literature analysis video essay"
      - type: video_search
        value: "book club discussion questions"
      - type: video_search
        value: "what should I read next recommendations"
      - type: video_search
        value: "BookTok reading community react"
      - type: video_search
