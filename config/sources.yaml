global:
  timezone: "UTC"
  db_path: "~/social_scanner/state.db"
  output_html: "~/social_scanner/rendered/index.html"
  max_items_per_subreddit: 75   # wider: collect more per subreddit
  max_claude_batch_size: 50     # wider: evaluate more candidates per run
  min_score: 5                  # wider: lower engagement gate (was 10)
  min_comments: 3               # wider: lower comment gate (was 5)
  item_age_limit_hours: 120     # wider: consider posts up to 5 days old (was 72)
  claude_model: "claude-sonnet-4-6"
  claude_max_tokens: 4096
  reddit_request_delay_seconds: 1.0
  book_list_path: "~/git/kvasir_proto/src/html/kvasir.pub/book-list.txt"

subreddits:
  # Books / reading (kept, but trimmed — we were over-indexed on heavy literary)
  - name: books
    enabled: true
  - name: suggestmeabook
    enabled: true
  - name: booksuggestions
    enabled: true
  - name: 52book
    enabled: true
  - name: bookclub
    enabled: false
  - name: classics
    enabled: false        # too heavy-literary; de-prioritized
  - name: literature
    enabled: false        # too heavy-literary; de-prioritized
  - name: whattoreadwhen
    enabled: true
  # Specific authors / classic literature
  - name: dostoevsky
    enabled: true
  - name: Sherlock
    enabled: true
  # Entertainment / fun / animals (new emphasis — lead with play, not homework)
  - name: aww
    enabled: true
  - name: Awwducational
    enabled: true
  - name: AnimalsBeingDerps
    enabled: true
  - name: NatureIsFuckingLit
    enabled: true
  - name: likeus
    enabled: true
  - name: WritingPrompts
    enabled: true
  - name: tipofmytongue
    enabled: true
  - name: CasualConversation
    enabled: true
  # AI / tech
  - name: ChatGPT
    enabled: true
  - name: artificial
    enabled: true
  - name: SideProject
    enabled: true
  # Education / teaching
  - name: Teachers
    enabled: true
  - name: homeschool
    enabled: true
  # Games / quiz (→ suggest quizly.pub main site)
  - name: trivia
    enabled: true
  - name: wordgames
    enabled: true
  - name: boardgames
    enabled: true
  - name: rpg
    enabled: true
  - name: puzzles
    enabled: true
  # Russian-language communities (expanded — large, underserved audience)
  - name: ru
    enabled: true
  - name: RussianLiterature
    enabled: true
  - name: russian
    enabled: true
  - name: AskARussian
    enabled: true
  - name: Pikabu
    enabled: true
  - name: Tiktokcringe   # RU meme/entertainment crossover
    enabled: false
  - name: 2ch
    enabled: true
  # AI video / creative contest communities (new — scene/video contest angle)
  - name: aigeneratedart
    enabled: true
  - name: StableDiffusion
    enabled: true
  - name: aivideo
    enabled: true
  - name: AIArt
    enabled: true
  - name: filmmakers
    enabled: false

twitter_searches:
  # Books / reading discovery
  - query: "book quiz OR book club discussion OR what should I read"
    enabled: true
  - query: "interactive reading OR AI reading app OR book recommendations app"
    enabled: true
  # AI-assisted learning
  - query: "AI for learning OR interactive learning app OR AI education tool"
    enabled: true
  # Literary / classics
  - query: "classic literature discussion OR literary quiz OR great books"
    enabled: true
  # Teaching / classroom
  - query: "AI classroom tool OR EdTech reading OR book quiz for students"
    enabled: false

